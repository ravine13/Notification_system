# Server port
server.port=9123

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
#FRONTEND_URL=https://notification-frontend-kappa.vercel.app

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notification_system?verifyServerCertificate=false&useSSL=false&requireSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}


# Show SQL queries in logs
spring.jpa.show-sql=true

# Enable debugging
debug=true

africastalking.username=sandbox
africastalking.api-key=atsk_3538ab4cfcb68c138d1960044c8fa3e594d74cc749d1d6f0f26f6db8147e6a2ddbf74787
africastalking.base-url=https://api.africastalking.com


# WhatsApp Cloud API

whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.api-version=v25.0
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.mode=${WHATSAPP_MODE:text}

server.error.include-message=always
server.error.include-binding-errors=always

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
